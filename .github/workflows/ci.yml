name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[images]"

      - name: Run tests
        run: python -m unittest discover -s tests -v

  package:
    name: Build and verify distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Install wheel into a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/verify"
          "$RUNNER_TEMP/verify/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/verify/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/verify/bin/jxlerate" --version
          "$RUNNER_TEMP/verify/bin/jxlerate" --help > /dev/null

      - name: Confirm both entry points are installed
        run: >
          "$RUNNER_TEMP/verify/bin/python" -c
          "import importlib.metadata as md;
          c = {e.name: e.value for e in md.entry_points(group='console_scripts')};
          g = {e.name: e.value for e in md.entry_points(group='gui_scripts')};
          assert c['jxlerate'] == 'jxlerate:main', c;
          assert g['jxlerate-gui'] == 'jxlerate_gui:main', g;
          print('entry points ok')"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
